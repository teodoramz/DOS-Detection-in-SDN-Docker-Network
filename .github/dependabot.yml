version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /build/worker
      - /build/collector
      - /build/webserver/project
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /build/ryu-controller
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # ryu 4.34 is the controller framework the project is built on and it is
    # unmaintained: it requires eventlet<0.31, which in turn requires
    # dnspython<2. Raising any of the three breaks the controller outright, so
    # updates to them are declined here rather than opened and closed again.
    ignore:
      - dependency-name: ryu
      - dependency-name: eventlet
      - dependency-name: dnspython

  - package-ecosystem: docker
    directories:
      - /build/worker
      - /build/collector
      - /build/ryu-controller
      - /build/minio
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
